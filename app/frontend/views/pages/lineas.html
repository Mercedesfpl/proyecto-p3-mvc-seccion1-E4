<!-- app/frontend/views/pages/lineas.html -->
{% extends 'layouts/base.html' %}

{% block title %}Líneas de Transporte{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
<style>
    .btn-add {
        background: var(--azul);
        color: white;
        padding: 10px 20px;
        border-radius: 40px;
        border: none;
        cursor: pointer;
        margin-bottom: 20px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
    }
    .btn-add:hover {
        background: #5A8FB7;
    }
    
    /* Modal */
    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        z-index: 1000;
        align-items: center;
        justify-content: center;
    }
    .modal-content {
        background: white;
        border-radius: 20px;
        width: 500px;
        max-width: 90%;
        padding: 24px;
        position: relative;
    }
    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }
    .modal-header h2 {
        font-size: 20px;
        font-weight: 600;
    }
    .modal-close {
        cursor: pointer;
        font-size: 24px;
        color: var(--texto-claro);
    }
    .form-group {
        margin-bottom: 16px;
    }
    .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 6px;
        color: var(--texto-oscuro);
    }
    .form-group input {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid var(--borde);
        border-radius: 12px;
        font-size: 14px;
    }
    .form-group input:focus {
        outline: none;
        border-color: var(--azul);
    }
    .btn-guardar {
        background: var(--azul);
        color: white;
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 40px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
    }
    .btn-guardar:hover {
        background: #5A8FB7;
    }
    
    /* Tabla */
    .tabla-container {
        background: white;
        border-radius: 20px;
        padding: 20px;
        box-shadow: var(--sombra);
        overflow-x: auto;
    }
    .data-table {
        width: 100%;
        border-collapse: collapse;
    }
    .data-table th {
        text-align: left;
        padding: 12px;
        background: var(--gris);
        font-weight: 600;
        font-size: 13px;
    }
    .data-table td {
        padding: 12px;
        border-bottom: 1px solid var(--borde);
        font-size: 14px;
    }
    .btn-edit, .btn-delete {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 16px;
        margin: 0 4px;
    }
    .btn-edit { color: var(--azul); }
    .btn-delete { color: var(--rojo); }
    
    .toast-message {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: var(--texto-oscuro);
        color: white;
        padding: 12px 20px;
        border-radius: 40px;
        font-size: 14px;
        display: none;
        z-index: 1001;
    }
    .toast-message.success { background: #10b981; }
    .toast-message.error { background: var(--rojo); }
</style>
{% endblock %}

{% block content %}
<div class="main-content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1>Gestión de Líneas</h1>
        <button class="btn-add" id="btnNuevaLinea"><i class="fas fa-plus"></i> Nueva Línea</button>
    </div>
    
    <div class="tabla-container">
        <div id="tablaLineas"></div>
    </div>
</div>

<!-- Modal -->
<div id="lineaModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Nueva Línea</h2>
            <span class="modal-close" onclick="cerrarModal()">&times;</span>
        </div>
<form id="lineaForm">
    <div class="form-group">
        <label>Nombre de la Línea *</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej: Línea 1 - Los Teques" required>
    </div>
    <div class="form-group">
        <label>RIF *</label>
        <input type="text" id="rif" name="rif" placeholder="Ej: J-12345678-0" required>
    </div>

    <h4 style="margin: 20px 0 10px 0; border-bottom: 1px solid var(--borde); padding-bottom: 8px;">Datos del Presidente</h4>

    <div class="form-row">
        <div class="form-group">
            <label>Nombre *</label>
            <input type="text" id="presidente_nombre" placeholder="Nombre" required>
        </div>
        <div class="form-group">
            <label>Apellido *</label>
            <input type="text" id="presidente_apellido" placeholder="Apellido" required>
        </div>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label>Cédula *</label>
            <input type="text" id="presidente_cedula" placeholder="Ej: 12345678" required>
        </div>
        <div class="form-group">
            <label>Correo</label>
            <input type="email" id="presidente_correo" placeholder="correo@ejemplo.com">
        </div>
    </div>
    <div class="form-group">
        <label>Teléfono</label>
        <input type="text" id="telefono" placeholder="Ej: 04121234567">
    </div>

    <!-- BOTON GUARDAR -->
    <button type="submit" class="btn-guardar">Guardar Línea</button>
</form>
    </div>
</div>

<div id="toastMessage" class="toast-message"></div>
{% endblock %}

{% block scripts %}
<script>
    let editandoId = null;
    
    function showToast(message, type = 'success') {
        const toast = document.getElementById('toastMessage');
        toast.textContent = message;
        toast.className = `toast-message ${type}`;
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 3000);
    }
    
    function abrirModal(titulo, data = null) {
        document.getElementById('modalTitle').textContent = titulo;
        if (data) {
            document.getElementById('nombre').value = data.nombre || '';
            document.getElementById('presidente_nombre').value = data.presidente_nombre || '';
            document.getElementById('presidente_cedula').value = data.presidente_cedula || '';
            document.getElementById('telefono').value = data.telefono || '';
            document.getElementById('rif').value = data.rif || '';
        } else {
            document.getElementById('lineaForm').reset();
        }
        document.getElementById('lineaModal').style.display = 'flex';
    }
    
    function cerrarModal() {
        document.getElementById('lineaModal').style.display = 'none';
        editandoId = null;
    }
    
    async function cargarLineas() {
        try {
            const response = await fetch('/admin/lineas');
            const data = await response.json();
            const lineas = data.data || [];
            
            const tablaHtml = `
                <table class="data-table">
                    <thead>
                        <tr><th>ID</th><th>Nombre</th><th>Presidente</th><th>Teléfono</th><th>RIF</th><th>Acciones</th></tr>
                    </thead>
                    <tbody>
                        ${lineas.map(linea => `
                            <tr>
                                <td>${linea.id}</td>
                                <td>${linea.nombre}</td>
                                <td>${linea.presidente_nombre}</td>
                                <td>${linea.telefono}</td>
                                <td>${linea.rif}</td>
                                <td>
                                    <button class="btn-edit" onclick="editarLinea(${linea.id})"><i class="fas fa-edit"></i></button>
                                    <button class="btn-delete" onclick="eliminarLinea(${linea.id})"><i class="fas fa-trash"></i></button>
                                </td>
                            </tr>
                        `).join('')}
                        ${lineas.length === 0 ? '<tr><td colspan="6" style="text-align: center;">No hay líneas registradas</td></tr>' : ''}
                    </tbody>
                </table>
            `;
            document.getElementById('tablaLineas').innerHTML = tablaHtml;
        } catch (error) {
            showToast('Error al cargar líneas', 'error');
        }
    }
    
    async function editarLinea(id) {
        try {
            const response = await fetch(`/admin/lineas/${id}`);
            const data = await response.json();
            const linea = data.data;
            editandoId = id;
            abrirModal('Editar Línea', linea);
        } catch (error) {
            showToast('Error al cargar la línea', 'error');
        }
    }
    
    async function eliminarLinea(id) {
        if (confirm('¿Estás seguro de suspender esta línea?')) {
            try {
                const response = await fetch(`/admin/lineas/${id}`, { method: 'DELETE' });
                const data = await response.json();
                if (response.ok) {
                    showToast('Línea suspendida exitosamente', 'success');
                    cargarLineas();
                } else {
                    showToast(data.message || 'Error al eliminar', 'error');
                }
            } catch (error) {
                showToast('Error de conexión', 'error');
            }
        }
    }
    
    document.getElementById('lineaForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const datos = {
            nombre: document.getElementById('nombre').value,
            rif: document.getElementById('rif').value,
            presidente_nombre: document.getElementById('presidente_nombre').value,
            presidente_apellido: document.getElementById('presidente_apellido').value,
            presidente_cedula: document.getElementById('presidente_cedula').value,
            presidente_correo: document.getElementById('presidente_correo').value,
            telefono: document.getElementById('telefono').value,
            secretario_id: null  
        };
        console.log('Datos a enviar:', datos);
        const url = editandoId ? `/admin/lineas/${editandoId}` : '/admin/lineas';
        const method = editandoId ? 'PUT' : 'POST';
        
        try {
            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
            const data = await response.json();
            
            if (response.ok) {
                showToast(editandoId ? 'Línea actualizada' : 'Línea creada', 'success');
                cerrarModal();
                cargarLineas();
            } else {
                showToast(data.message || data.error || 'Error al guardar', 'error');
            }
        } catch (error) {
            showToast('Error de conexión', 'error');
        }
    });
    
    document.getElementById('btnNuevaLinea').onclick = () => {
        editandoId = null;
        abrirModal('Nueva Línea');
    };
    
    cargarLineas();
</script>
{% endblock %}
