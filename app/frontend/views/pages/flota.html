<!-- app/frontend/views/pages/flota.html -->

{% extends 'layouts/base.html' %}

{% block title %}Flota{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/flota.css') }}">
{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Gestión de Flota</h1>
    <button class="btn-add" id="btnNuevaUnidad">
        <i class="fas fa-plus"></i> Nueva Unidad
    </button>
</div>

<div class="tabla-container">
    <div class="tabla-toolbar">
        <div class="tabla-busqueda">
            <i class="fas fa-search"></i>
            <input type="text" id="searchUnidad" placeholder="Buscar por placa o línea...">
        </div>
        <div class="filter-group">
            <select class="filter-select" id="filterLinea">
                <option value="">Todas las líneas</option>
            </select>
            <select class="filter-select" id="filterEstado">
                <option value="">Todos los estados</option>
                <option value="activa">Activa</option>
                <option value="inactiva">Inactiva</option>
            </select>
        </div>
    </div>
    <div id="tablaUnidades"></div>
    <div class="tabla-paginacion" id="paginacionUnidades">
        <button id="btnAnterior" disabled>
            <i class="fas fa-chevron-left"></i> Anterior
        </button>
        <span class="info-pagina" id="infoPagina">Página 1 de 1</span>
        <button id="btnSiguiente" disabled>
            Siguiente <i class="fas fa-chevron-right"></i>
        </button>
    </div>
</div>

<!-- MODAL NUEVA UNIDAD -->
<div id="modalNuevaUnidad" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-bus"></i> <span id="modalUnidadTitle">Nueva Unidad</span></h2>
            <span class="modal-close" onclick="cerrarModalUnidad()">&times;</span>
        </div>
        <form id="formNuevaUnidad">
            <div class="form-row">
                <div class="form-group">
                    <label>Placa <span class="required">*</span></label>
                    <input type="text" id="placa" name="placa" placeholder="Ej: ABC123" required>
                </div>
                <div class="form-group">
                    <label>Línea <span class="required">*</span></label>
                    <select id="id_linea" name="id_linea" required>
                        <option value="">Seleccione una línea...</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Ruta <span style="color: var(--texto-claro); font-weight: 400;">(opcional)</span></label>
                    <select id="id_ruta" name="id_ruta">
                        <option value="">Sin ruta asignada</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Estado</label>
                    <select id="status" name="status">
                        <option value="activa">Activa</option>
                        <option value="inactiva">Inactiva</option>
                    </select>
                </div>
            </div>

            <div style="margin-top: 12px; padding: 10px; background: #f0f7ff; border-radius: 6px; font-size: 13px; color: #1a3a5c;">
                <i class="fas fa-info-circle" style="color: #1a73e8;"></i>
                La placa debe ser única.
            </div>

            <button type="submit" class="btn-guardar" id="guardarUnidadBtn">
                <i class="fas fa-save"></i> Guardar Unidad
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/flota.js') }}"></script>
{% endblock %}
