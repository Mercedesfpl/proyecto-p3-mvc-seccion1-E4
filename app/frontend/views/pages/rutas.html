<!-- app/frontend/views/pages/rutas.html -->

{% extends 'layouts/base.html' %}

{% block title %}Gestión de Rutas{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/rutas.css') }}">
{% endblock %}

{% block content %}
<div class="rutas-header">
    <h1>Gestión de Rutas</h1>
    <button class="btn-add" id="btnNuevaRuta">
        <i class="fas fa-plus"></i> Nueva Ruta
    </button>
</div>

<div class="tabla-container">
    <div id="tablaRutas"></div>
</div>

<!-- MODAL -->
<div id="rutaModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>
                <i class="fas fa-route"></i>
                <span id="modalTitle">Nueva Ruta</span>
            </h2>
            <span class="modal-close" onclick="cerrarModal()">
                <i class="fas fa-times"></i>
            </span>
        </div>

        <form id="rutaForm">
            <!-- Nombre -->
            <div class="form-group">
                <label>Nombre de la Ruta <span class="required">*</span></label>
                <input type="text" id="nombre" placeholder="Ej: Ruta Los Teques - Caracas" required>
            </div>

            <!-- Línea -->
            <div class="form-group">
                <label>Línea <span class="required">*</span></label>
                <select id="id_linea" class="form-select" required>
                    <option value="">Seleccione una línea...</option>
                </select>
            </div>

            <!-- Estado -->
            <div class="form-group">
                <label>Estado</label>
                <select id="status" class="form-select">
                    <option value="activa">Activa</option>
                    <option value="inactiva">Inactiva</option>
                </select>
            </div>

            <!-- Paradas -->
            <div class="form-group">
                <label>Paradas (en orden) <span class="required">*</span></label>
                <div class="paradas-container" id="paradasContainer">
                    <div class="parada-item">
                        <select id="paradas_select" class="form-select" multiple style="height: 150px;">
                        </select>
                        <small>Mantén presionada la tecla Ctrl para seleccionar múltiples paradas en orden</small>
                    </div>
                    <div class="paradas-orden" id="paradasOrden">
                        <label>Orden de paradas seleccionadas:</label>
                        <ul id="paradasList"></ul>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-guardar" id="btnGuardar">
                <i class="fas fa-save"></i> Guardar Ruta
            </button>
        </form>
    </div>
</div>

<!-- Toast para notificaciones -->
<div id="toastMessage" class="toast-message"></div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/rutas.js') }}"></script>
{% endblock %}
