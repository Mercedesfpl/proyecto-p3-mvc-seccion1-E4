<!-- app/frontend/views/pages/perfil.html -->
{% extends "layouts/base.html" %} {% block title %}Mi Perfil - Sistema de
Transporte{% endblock %} {% block content %}
<div class="container mt-4">
  <div class="row">
    <div class="col-md-8 mx-auto">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4><i class="fas fa-user-circle"></i> Mi Perfil</h4>
        </div>
        <div class="card-body">
          <!-- FORMULARIO DE PERFIL -->
          <form id="perfilForm">
            <div class="form-group mb-3">
              <label for="nombre"
                ><i class="fas fa-user"></i> Nombre completo</label
              >
              <input
                type="text"
                class="form-control"
                id="nombre"
                name="nombre"
              />
            </div>
            <div class="form-group mb-3">
              <label for="email"
                ><i class="fas fa-envelope"></i> Correo electrónico</label
              >
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
              />
            </div>
            <div class="form-group mb-3">
              <label for="rol"><i class="fas fa-user-tag"></i> Rol</label>
              <select class="form-control" id="rol" name="rol" disabled>
                <option value="admin">Administrador</option>
                <option value="secretario">Secretario</option>
                <option value="presidente">Presidente</option>
                <option value="usuario">Usuario</option>
              </select>
              <small class="form-text text-muted"
                >El rol no se puede modificar desde este formulario.</small
              >
            </div>
            <div class="d-flex justify-content-between">
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Actualizar perfil
              </button>
              <button
                type="button"
                class="btn btn-outline-secondary"
                id="btnCambiarContrasena"
              >
                <i class="fas fa-key"></i> Cambiar contraseña
              </button>
            </div>
          </form>

          <!-- SECCIÓN CAMBIAR CONTRASEÑA (colapsable) -->
          <div
            id="cambiarContrasenaSection"
            style="
              display: none;
              margin-top: 20px;
              border-top: 1px solid #ddd;
              padding-top: 20px;
            "
          >
            <h5><i class="fas fa-key"></i> Cambiar contraseña</h5>
            <form id="cambiarContrasenaForm">
              <div class="form-group mb-3">
                <label for="currentPassword">Contraseña actual</label>
                <input
                  type="password"
                  class="form-control"
                  id="currentPassword"
                  placeholder="Ingresa tu contraseña actual"
                />
              </div>
              <div class="form-group mb-3">
                <label for="newPassword">Nueva contraseña</label>
                <input
                  type="password"
                  class="form-control"
                  id="newPassword"
                  placeholder="Nueva contraseña"
                />
              </div>
              <div class="form-group mb-3">
                <label for="confirmPassword">Confirmar nueva contraseña</label>
                <input
                  type="password"
                  class="form-control"
                  id="confirmPassword"
                  placeholder="Confirma tu nueva contraseña"
                />
              </div>
              <button type="submit" class="btn btn-success">
                <i class="fas fa-save"></i> Cambiar contraseña
              </button>
              <button
                type="button"
                class="btn btn-secondary"
                id="btnCancelarCambio"
              >
                Cancelar
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %} {% block scripts %}
<script src="{{ url_for('static', filename='../static/js/perfil.js') }}"></script>
{% endblock %}
