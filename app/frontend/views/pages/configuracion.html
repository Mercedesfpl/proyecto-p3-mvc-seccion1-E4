{% extends "layouts/base.html" %} {% block title %}Configuración - Sistema de
Transporte{% endblock %} {% block content %}
<div class="container mt-4">
  <div class="row">
    <div class="col-md-8 mx-auto">
      <div class="card shadow">
        <div class="card-header bg-secondary text-white">
          <h4><i class="fas fa-cog"></i> Configuración</h4>
        </div>
        <div class="card-body">
          <form id="configForm">
            <div class="form-group mb-3">
              <label for="tema"><i class="fas fa-palette"></i> Tema</label>
              <select class="form-control" id="tema" name="tema">
                <option value="claro">Claro</option>
                <option value="oscuro">Oscuro</option>
              </select>
            </div>
            <div class="form-group mb-3">
              <label for="notificaciones"
                ><i class="fas fa-bell"></i> Notificaciones</label
              >
              <select
                class="form-control"
                id="notificaciones"
                name="notificaciones"
              >
                <option value="activadas">Activadas</option>
                <option value="desactivadas">Desactivadas</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save"></i> Guardar configuración
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %} {% block scripts %}
<script src="{{ url_for('static', filename='js/pages/configuracion.js') }}"></script>
{% endblock %}
