{% extends 'layouts/base.html' %}

{% block title %}Dispositivos ESP32 - Sistema de Transporte{% endblock %}

{% block content %}
<div class="main-content" style="margin-left: 0 !important; padding: 24px;">

    <!-- Encabezado de Página -->
    <div class="page-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h1>Gestión de Dispositivos ESP32</h1>
        <button class="btn-primary" id="btnNuevoEsp32">
            <i class="fas fa-plus"></i> Nuevo ESP32
        </button>
    </div>

    <!-- Tarjeta Principal con Buscador y Filtros -->
    <div class="card">
        <div class="tabla-toolbar" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 20px;">
            
            <div class="tabla-busqueda" style="position: relative; min-width: 260px;">
                <i class="fas fa-search" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--texto-claro);"></i>
                <input type="text" id="searchEsp32" placeholder="Buscar por MAC..." style="padding-left: 36px; width: 100%;" />
            </div>

            <div class="filter-group" style="display: flex; gap: 12px; flex-wrap: wrap;">
                <select class="filter-select" id="filterTipo">
                    <option value="">Todos los Tipos</option>
                    <option value="bus">Bus</option>
                    <option value="parada">Parada</option>
                </select>
                <select class="filter-select" id="filterStatus">
                    <option value="">Todos los Estados</option>
                    <option value="activo">Activo</option>
                    <option value="inactivo">Inactivo</option>
                </select>
            </div>

        </div>

        <!-- Contenedor donde se renderiza la tabla -->
        <div id="tablaEsp32" class="tabla-responsive">
            <!-- Renderizado dinámico vía JS -->
        </div>
    </div>

</div>

<!-- MODAL PARA NUEVO / EDITAR ESP32 -->
<div id="modalEsp32" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1050; align-items: center; justify-content: center;">
    <div class="card modal-content" style="max-width: 500px; width: 90%; margin: auto; padding: 24px;">
        
        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--borde); padding-bottom: 12px; margin-bottom: 20px;">
            <h2 style="font-size: 18px; margin: 0;"><i class="fas fa-microchip" style="color: var(--azul);"></i> <span id="modalTitle">Nuevo ESP32</span></h2>
            <span class="modal-close" id="btnCloseModal" style="cursor: pointer; font-size: 24px; color: var(--texto-claro);">&times;</span>
        </div>

        <form id="formEsp32">
            <input type="hidden" id="esp32Id" value="">

            <div class="form-group" style="margin-bottom: 16px;">
                <label for="mac"><i class="fas fa-network-wired"></i> Dirección MAC *</label>
                <input type="text" id="mac" placeholder="AA:BB:CC:DD:EE:FF" required style="width: 100%; margin-top: 6px;" />
            </div>

            <div class="form-group" style="margin-bottom: 16px;">
                <label for="password"><i class="fas fa-key"></i> Contraseña *</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required style="width: 100%; margin-top: 6px;" />
            </div>

            <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
                <div class="form-group">
                    <label for="tipo_dispositivo"><i class="fas fa-tag"></i> Tipo *</label>
                    <select id="tipo_dispositivo" required style="width: 100%; margin-top: 6px;">
                        <option value="">Seleccionar...</option>
                        <option value="bus">Bus</option>
                        <option value="parada">Parada</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="version_firmware"><i class="fas fa-code-branch"></i> Firmware</label>
                    <input type="text" id="version_firmware" placeholder="1.0.0" style="width: 100%; margin-top: 6px;" />
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label for="status"><i class="fas fa-toggle-on"></i> Estado</label>
                <select id="status" style="width: 100%; margin-top: 6px;">
                    <option value="activo">Activo</option>
                    <option value="inactivo">Inactivo</option>
                </select>
            </div>

            <div style="display: flex; gap: 12px; justify-content: flex-end;">
                <button type="button" class="btn-secondary" id="btnCancelarModal">Cancelar</button>
                <button type="submit" class="btn-primary">
                    <i class="fas fa-save"></i> Guardar
                </button>
            </div>
        </form>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/esp32.js') }}"></script>
{% endblock %}
